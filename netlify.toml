[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El panel de edición ya no vive aquí: Sanity Studio se despliega aparte.
# Sustituye el subdominio si eliges otro nombre al ejecutar `npm run studio:deploy`.
[[redirects]]
  from = "/admin"
  to = "https://academia-la-clave.sanity.studio"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://academia-la-clave.sanity.studio"
  status = 301
  force = true

# Astro genera /gracias/index.html. Esta regla evita que la versión sin barra
# final acabe en la 404 en configuraciones que no normalizan la barra.
[[redirects]]
  from = "/gracias"
  to = "/gracias/"
  status = 301

# Cabeceras básicas de seguridad. Ajusta la CSP cuando añadas
# analítica, vídeos embebidos u otros terceros.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
